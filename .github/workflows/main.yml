name: Build Rovian Client

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm install
      - name: Generate Tauri icons
        run: npx tauri icon public/rovian-mark.svg
      - name: Build desktop application
        run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rovian-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
