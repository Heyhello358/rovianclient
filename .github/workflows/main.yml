name: Build Rovian Client

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm install
      - name: Generate Tauri icons
        run: npx tauri icon public/rovian-mark.svg
      - name: Build desktop application
        run: npm run tauri:build
      - name: Rename installer files
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PLATFORM=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          ARCH=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
          find src-tauri/target/release/bundle -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.rpm' -o -iname '*.appimage' \) -print0 |
          while IFS= read -r -d '' file; do
            extension="${file##*.}"
            directory=$(dirname "$file")
            mv "$file" "$directory/Rovian-Client-$VERSION-$PLATFORM-$ARCH.$extension"
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Rovian-Client-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
