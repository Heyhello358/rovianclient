name: Build Rovian Link Bridge
on:
  push:
    branches: [rovian-fabric-1.21.11]
    paths:
      - 'rovian-link-bridge/**'
      - '.github/workflows/build-link-bridge.yml'
  pull_request:
    branches: [rovian-fabric-1.21.11]
    paths:
      - 'rovian-link-bridge/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        working-directory: rovian-link-bridge
        run: gradle build
      - name: Upload Paper plugin
        uses: actions/upload-artifact@v4
        with:
          name: Rovian-Link-Bridge-0.1.0
          path: rovian-link-bridge/build/libs/*.jar
