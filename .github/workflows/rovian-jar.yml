name: Build Rovian JAR

on:
  push:
    branches: [rovian-fabric-1.21.11]
    tags: ["rovian-v*"]
    paths:
      - "rovian-fabric/**"
      - ".github/workflows/rovian-jar.yml"
  pull_request:
    branches: [rovian-fabric-1.21.11]
    paths:
      - "rovian-fabric/**"
      - ".github/workflows/rovian-jar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rovian-fabric
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - name: Build mod
        run: gradle build --no-daemon
      - name: Prepare versioned JAR
        id: package
        shell: bash
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | head -n1)
          test -n "$VERSION"
          SOURCE="build/libs/rovian-client-$VERSION.jar"
          test -f "$SOURCE"
          mkdir -p ../release
          cp "$SOURCE" "../release/Rovian-Client-$VERSION.jar"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rovian-Client-${{ steps.package.outputs.version }}
          path: release/Rovian-Client-${{ steps.package.outputs.version }}.jar
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/rovian-v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Rovian-Client-${{ steps.package.outputs.version }}.jar
          generate_release_notes: true
